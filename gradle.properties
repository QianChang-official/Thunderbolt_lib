minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.219
neo_version_range=[21,)
loader_version_range=[4,)

## Build Identity
artifact_name=Thunderbolt_core

## Mod Properties
mod_id=ae2lt_core
mod_name=Thunderbolt Core
mod_license=MIT
mod_version=2.0.0-alpha.1
mod_group_id=com.qianchang.ae2lt_core
mod_authors=QianChang
mod_description=AE2 core optimization and feature layer for AE2 Lightning Tech. Replaces AE2's autocrafting planner with a linear (O(n+E), amount-independent) fast path, and hosts low-level AE2 patches/hooks that addons and AE2LT build upon. (Repurposed from the former Thunderbolt_lib reflection API, which is removed in 2.x.)
